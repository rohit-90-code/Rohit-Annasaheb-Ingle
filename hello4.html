<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEAL Central Placement Cell</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
}

/* Header */
.header{
    background:#ffffff;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.header h1{
    font-size:26px;
    letter-spacing:1px;
}

.header span{
    font-size:14px;
    color:#555;
}

/* Banner Image */
.banner img{
    width: 200px;;
    height: 200px;;
    text-align: center;
}

/* Blue Bar */
.blue-bar{
    background:#0b4ea2;
    color:#fff;
    padding:15px;
    font-size:20px;
    display:flex;
    align-items:center;
}

.blue-bar i{
    margin-right:10px;
}

/* Section Title */
.section-title{
    text-align:center;
    padding:30px 0 10px;
    font-size:28px;
    font-weight:bold;
    color:#333;
}

/* Card Container */
.container{
    width:90%;
    margin:20px auto;
}

/* Cards */
.card{
    color:#fff;
    border-radius:25px;
    padding:30px;
    margin-bottom:25px;
    text-align:center;
}

.card h2{
    font-size:50px;
    margin-bottom:10px;
}

.card p{
    font-size:22px;
    font-weight:bold;
}

/* Card Colors */
.yellow{
    background:#f4b400;
}

.red{
    background:#b32626;
}

.purple{
    background:#6a0dad;
}

/* Responsive */
@media(max-width:768px){
    .card h2{
        font-size:40px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <h1>ZEAL</h1>
    <span>Central Placement Cell</span>
</div>

<!-- Banner Image -->
<div class="banner" style="text-align: center;">
    <img src="https://tse1.mm.bing.net/th/id/OIP.RyEMX6hd3zok62YnnSaI9wAAAA?pid=Api&P=0&h=180" alt="" height="200" width="500">
</div>

<!-- Blue Bar -->
<div class="blue-bar">
    🏠 Central Placement Cell
</div>

<!-- Section Title -->
<div class="section-title">
    Placement Highlights
</div>

<!-- Cards -->
<div class="container">

    <div class="card yellow">
        <h2>350 +</h2>
        <p>No. of Companies Visited</p>
    </div>

    <div class="card red">
        <h2>₹ 43 Lakhs</h2>
        <p>Highest Package Offered</p>
    </div>

    <div class="card purple">
        <h2>₹ 14.75 Lakhs</h2>
        <p>Highest Package Placed</p>
    </div>

</div>

</body>
</html>
